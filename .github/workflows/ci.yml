name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
