id = "herdsman.agents"
name = "Herdsman Agents"
version = "0.11.6"
min_herdr_version = "0.7.0"
description = "Read compact Herdr agent history through Herdsman."
platforms = ["linux"]

[[actions]]
id = "agent-list"
title = "Show Herdsman agents"
contexts = ["workspace"]
command = ["node", "index.mjs", "agent-list"]

[[panes]]
id = "agents"
title = "Herdsman Agents"
placement = "split"
command = ["node", "index.mjs", "agents"]
